name: Playwright Active Session Ping

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *' # Triggers every 15 minutes

jobs:
  playwright-job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright

    - name: Install Playwright Browsers
      run: |
        python -m playwright install --with-deps chromium

    - name: Run Playwright Script
      env:
        COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
      run: |
        python -u run_request.py

    - name: Upload Screenshots
      if: always()
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: ping-screenshots-${{ github.run_number }}
        path: screenshots/
        if-no-files-found: warn

    - name: Show Screenshot Link
      if: always()
      run: |
        echo "Screenshots: ${{ steps.upload.outputs.artifact-url }}"
        echo "### Ping screenshots" >> $GITHUB_STEP_SUMMARY
        echo "[Download screenshots](${{ steps.upload.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
        echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
