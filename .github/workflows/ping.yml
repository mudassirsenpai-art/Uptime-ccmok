name: Ping Clusy with JSON Cookies

on:
  workflow_dispatch: # Manual trigger ke liye button mil jayega
  schedule:
    - cron: '0 */6 * * *' # Har 6 ghante baad automatically chalega

jobs:
  ping-job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run ping script
      env:
        COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
      run: |
        python run_request.py
